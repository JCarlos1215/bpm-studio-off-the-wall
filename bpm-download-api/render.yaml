# Seleccionar este archivo como Blueprint Path en Render.
services:
  - type: web
    name: bpm-download-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./off-the-wall-mp3-studio/Dockerfile
    dockerContext: ./off-the-wall-mp3-studio
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/data
      - key: ALLOW_PUBLIC_ACCESS
        value: "true"
      - key: BPM_MEDIA_ENGINE
        value: native
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_QUEUED_JOBS
        value: "100"
      - key: MAX_PLAYLIST_ITEMS
        value: "20"
      - key: MP3_STUDIO_FRAME_ANCESTORS
        value: "'self' https://jcarlos1215.github.io"
