name: Build dedicated Stems server
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "STEMS_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-stems" >> "$GITHUB_ENV"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Linux image
        uses: docker/build-push-action@v6
        with:
          context: stems-studio
          file: stems-studio/Dockerfile
          push: true
          tags: |
            ${{ env.STEMS_IMAGE }}:latest
            ${{ env.STEMS_IMAGE }}:${{ github.sha }}
