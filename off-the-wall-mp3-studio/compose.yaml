services:
  alltomp3:
    build: .
    ports:
      - "8093:8093"
    environment:
      HOST: 0.0.0.0
      PORT: 8093
      DATA_DIR: /app/data
      APP_PASSWORD: ${APP_PASSWORD:?Configura APP_PASSWORD en .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-100}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
    volumes:
      - alltomp3-data:/app/data
    restart: unless-stopped
volumes:
  alltomp3-data:
